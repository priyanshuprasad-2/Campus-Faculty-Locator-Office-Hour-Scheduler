
name: Build Campus Faculty Locator

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build Windows executable
        run: >
          pyinstaller --onefile --console
          --name "Campus Faculty Locator"
          "Campus Faculty Locator & Office Hour Scheduler.py"

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Campus-Faculty-Locator-Windows
          path: dist/Campus Faculty Locator.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Campus Faculty Locator.exe
